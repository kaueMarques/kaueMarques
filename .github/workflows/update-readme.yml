name: Atualizar Certificacoes e Status

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Executar script de atualizacao
        run: |
          python -c "
          import urllib.request, json, re, sys
          from datetime import datetime

          try:
              url = 'https://www.credly.com/users/kauemb/badges.json'
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req) as response:
                  data = json.loads(response.read().decode())
                  badges = data.get('data', [])
                  rows = ''
                  for b in badges:
                      url_b = f'https://www.credly.com/badge/{b.get(\"id\")}'
                      img = b.get('image_url', '')
                      name = b.get('badge_template', {}).get('name', '')
                      desc = b.get('badge_template', {}).get('description', '').replace('\n', ' ').strip()
                      rows += f'      <tr><td align=\"center\"><a href=\"{url_b}\" target=\"_blank\"><img width=\"150\" src=\"{img}\"/></a></td><td>{name}</td><td>{desc}</td></tr>\n'
              
              table = f'<!-- certs_start -->\n<div class=\"certifications\">\n   <h4><b>As certificacoes que obtive:</b></h4>\n   <table>\n      <tr align=\"center\">\n         <th>Badge</th>\n         <th>Nome da Certificacao</th>\n         <th>Descricao Resumida</th>\n      </tr>\n{rows}   </table>\n   <br>\n</div>\n<!-- certs_end -->'
              
              status = 'Sucesso'
              date_str = datetime.now().strftime('%d/%m/%Y as %H:%M')
              status_msg = f'<!-- status_start -->Status da ultima execucao: {status} em {date_str}<!-- status_end -->'

              with open('README.md', 'r', encoding='utf-8') as f:
                  content = f.read()
              
              content = re.sub(r'<!-- certs_start -->.*?<!-- certs_end -->', table, content, flags=re.DOTALL)
              content = re.sub(r'<!-- status_start -->.*?<!-- status_end -->', status_msg, content, flags=re.DOTALL)
              
              with open('README.md', 'w', encoding='utf-8') as f:
                  f.write(content)
          except Exception as e:
              print(f'Erro: {e}')
              sys.exit(1)
          "

      - name: Commit e Push
        run: |
          git config --local user.name 'github-actions[bot]'
          git config --local user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Atualizacao automatica das certificacoes'
            git push
          fi