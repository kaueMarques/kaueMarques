name: Atualizar Certificacoes

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Executar script de atualizacao
        run: |
          python -c "
          import urllib.request, json, re, sys
          try:
              oracle_badge = '''      <tr>
         <td align=\"center\"><a href=\"https://catalog-education.oracle.com/pls/certview/sharebadge?id=F2D2C0108FD8BBAF39FD4E4E3E3F336B015C9653C255A1BE722FD22105F793C4\" target=\"_blank\"><img width=\"150\" src=\"https://brm-workforce.oracle.com/pdf/certview/images/badge_icons/oci_foundations_assoc.png\"/></a></td>
         <td>Oracle Cloud Infrastructure Foundations 2021 Associate</td>
         <td>Certificacao baseada em implementacao de infraestrutura de ecossistema na nuvem.</td>
      </tr>\n'''

              url = 'https://www.credly.com/users/kauemb/badges.json'
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req) as response:
                  data = json.loads(response.read().decode())
                  badges = data.get('data', [])
                  rows = oracle_badge
                  for b in badges:
                      url_b = 'https://www.credly.com/badge/' + b.get('id', '')
                      img = b.get('image_url', '')
                      name = b.get('badge_template', {}).get('name', '')
                      desc = b.get('badge_template', {}).get('description', '')
                      if desc:
                          desc = desc.replace('\n', ' ').strip()
                      rows += '      <tr><td align=\"center\"><a href=\"' + url_b + '\" target=\"_blank\"><img width=\"150\" src=\"' + img + '\"/></a></td><td>' + name + '</td><td>' + desc + '</td></tr>\n'
              
              table = '<!-- certs_start -->\n<div class=\"certifications\">\n   <h4><b>As certificacoes que obtive:</b></h4>\n   <table>\n      <tr align=\"center\">\n         <th>Badge</th>\n         <th>Nome da Certificacao</th>\n         <th>Descricao Resumida</th>\n      </tr>\n' + rows + '   </table>\n   <br>\n</div>\n<!-- certs_end -->'
              
              with open('README.md', 'r', encoding='utf-8') as f:
                  content = f.read()
              
              content = re.sub(r'<!-- certs_start -->.*?<!-- certs_end -->', table, content, flags=re.DOTALL)
              
              with open('README.md', 'w', encoding='utf-8') as f:
                  f.write(content)
          except Exception as e:
              print('Erro:', e)
              sys.exit(1)
          "

      - name: Commit e Push
        run: |
          git config --local user.name 'github-actions[bot]'
          git config --local user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Atualizacao automatica das certificacoes'
            git push
          fi