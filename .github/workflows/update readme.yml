name: Atualizar Certificacoes

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Executar script de atualizacao
        run: |
          python -c '
          import urllib.request
          import json
          import re
          import sys

          url = "https://www.credly.com/users/kauemb/badges.json"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          
          rows_html = ""
          try:
              with urllib.request.urlopen(req) as response:
                  data = json.loads(response.read().decode())
                  badges = data.get("data", [])
                  
                  for badge in badges:
                      badge_url = f"https://www.credly.com/badge/{badge.get(\"id\")}"
                      image_url = badge.get("image_url", "")
                      title = badge.get("badge_template", {}).get("name", "")
                      description = badge.get("badge_template", {}).get("description", "")
                      description_clean = description.replace("\n", " ").strip() if description else ""

                      rows_html += f"""      <tr>
         <td align=\"center\"><a href=\"{badge_url}\" target=\"_blank\"><img width=\"150\" src=\"{image_url}\"/></a></td>
         <td>{title}</td>
         <td>{description_clean}</td>
      </tr>\n"""
          except Exception as e:
              print(f"Erro ao buscar badges: {e}")
              sys.exit(1)

          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          new_table = f"""<!-- certs_start -->
<div class="certifications">
   <h4><b>As certificacoes que obtive:</b></h4>
   <table>
      <tr align="center">
         <th>Badge</th>
         <th>Nome da Certificacao</th>
         <th>Descricao Resumida</th>
      </tr>
{rows_html}   </table>
   <br>
</div>
<!-- certs_end -->"""

          new_content = re.sub(r"<!-- certs_start -->.*?<!-- certs_end -->", new_table, content, flags=re.DOTALL)

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(new_content)
          '

      - name: Verificar mudancas
        run: |
          git status
          git diff

      - name: Commit e Push das alteracoes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "Atualizacao automatica das certificacoes"
            git push
          else
            echo "Nenhuma mudanca detectada."
          fi