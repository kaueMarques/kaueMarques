name: Atualizar Certificacoes

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Executar script de atualizacao
        run: |
          python -c '
          import urllib.request
          import json

          url = "https://www.credly.com/users/kauemb/badges.json"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          
          try:
              with urllib.request.urlopen(req) as response:
                  data = json.loads(response.read().decode())
                  total = len(data.get("data", []))
          except Exception as e:
              total = 0
              print(f"Erro ao buscar badges: {e}")

          print(f"Total de certificacoes encontradas: {total}")
          
          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          # Substituicao baseada em marcadores no seu README
          # Insira no seu README as tags <!-- credly_start --> e <!-- credly_end -->
          import re
          new_content = re.sub(r"<!-- credly_start -->.*?<!-- credly_end -->", f"<!-- credly_start -->{total}<!-- credly_end -->", content, flags=re.DOTALL)

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(new_content)
          '

      - name: Commit e Push das alteracoes
        run: |
          git config --global user.name "github-actions[bot]iro"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Atualizacao automatica das certificacoes da Credly" && git push)